# 🔬 مختبر الأسهم: باك تست walk-forward على محرك التطبيق نفسه — هل فلتر حالة السوق ووقف ATR بيحسنوا التوصيات؟
# البيانات: hist.json (فرع hist) · الكون: الأسهم المتوافقة مع الشريعة فقط ☪️ + فلتر سيولة ≥ مليون ج.م
# بيشتغل مرة واحدة عند تعديل stock_lab.js (أو يدويًا من Actions) — النتايج بتتنشر على فرع stockbt
name: 🔬 Stock Lab — باك تست محرك التوصيات
on:
  push:
    branches: [main]
    paths: ["stock_lab.js"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-lab
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: تنزيل التاريخ
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 60 -o hist.json "https://raw.githubusercontent.com/MedhatCoding/mistral-Mi/hist/hist.json"
          echo "✅ hist.json ($(wc -c < hist.json) بايت)"
      - name: استخراج المحرك من index.html
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -m1 "^const NF=" index.html
            grep -m1 "^const lastOf=" index.html
            grep -m1 "^let SIGW=" index.html
            grep -E "^function (sma|ema|rsi|macd|boll|atr)\(" index.html
            awk '/^function analyze\(/{f=1} f{print} f&&/^}/{f=0}' index.html
          } > engine.js
          grep -E "^const SHARIA_(IDX|EXTRA) ?=" index.html > sharia.js
          echo 'const SHARIA=[...SHARIA_IDX,...SHARIA_EXTRA];' >> sharia.js
          grep -q "function analyze" engine.js || { echo "❌ فشل استخراج المحرك"; exit 1; }
          grep -q "SHARIA_IDX" sharia.js || { echo "❌ فشل استخراج قائمة الشريعة"; exit 1; }
          echo "✅ المحرك جاهز"
      - name: تشغيل الباك تست
        continue-on-error: true
        shell: bash
        run: |
          {
            cat engine.js sharia.js stock_lab.js > lab.js
            node lab.js
          } > /tmp/lab.log 2>&1
      - name: عرض اللوج
        if: always()
        shell: bash
        run: cat /tmp/lab.log 2>/dev/null || echo "مفيش لوج"
      - name: نشر النتائج على فرع stockbt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pub
          if [ -f stock_bt.json ]; then
            cp stock_bt.json /tmp/pub/stock_bt.json
            MSG="chore: 🔬 نتايج باك تست الأسهم [skip ci]"
          else
            cp /tmp/lab.log /tmp/pub/lab-debug.txt 2>/dev/null || echo "مفيش لوج" > /tmp/pub/lab-debug.txt
            MSG="chore: 🔬 تشخيص فشل مختبر الأسهم [skip ci]"
          fi
          cd /tmp/pub
          git init -q -b stockbt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "$MSG"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/MedhatCoding/mistral-Mi.git" stockbt
          echo "✅ اتنشر على فرع stockbt"
