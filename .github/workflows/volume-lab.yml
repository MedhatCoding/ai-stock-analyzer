# 🧪 مختبر الفوليوم: باك تست واحد — هل عوامل حجم التداول تتحسن جودة توصيات المحرك الحالي؟
# بيشتغل مرة واحدة عند تعديل volume_lab.py نفسه (أو يدويًا من Actions) — مش جدول متكرر، صفر استهلاك إضافي على أي API
name: 🧪 Volume Lab — باك تست عوامل حجم التداول
on:
  push:
    branches: [main]
    paths: ["volume_lab.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: volume-lab
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🧪 تشغيل الباك تست
        continue-on-error: true
        shell: bash
        run: |
          {
            python3 volume_lab.py
          } > /tmp/lab.log 2>&1
      - name: 🖨️ عرض اللوج
        if: always()
        shell: bash
        run: cat /tmp/lab.log 2>/dev/null || echo "مفيش لوج"
      - name: 📤 نشر النتائج على فرع volbt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pub
          if [ -f volume_bt.json ]; then
            cp volume_bt.json /tmp/pub/volume_bt.json
            MSG="chore: 🧪 نتائج باك تست الفوليوم [skip ci]"
          else
            cp /tmp/lab.log /tmp/pub/lab-debug.txt 2>/dev/null || echo "مفيش لوج" > /tmp/pub/lab-debug.txt
            MSG="chore: 🧪 تشخيص فشل مختبر الفوليوم [skip ci]"
          fi
          cd /tmp/pub
          git init -q -b volbt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "$MSG"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/MedhatCoding/mistral-Mi.git" volbt
          echo "✅ اتنشر على فرع volbt"
