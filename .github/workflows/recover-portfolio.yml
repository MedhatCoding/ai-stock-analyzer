name: استعادة المحفظة من تاريخ Git
# 🧯 v4: الملف تاريخيًا بيتخزن بايتات خام (ترميز مزدوج قديم) — بقرا البايتات مباشرة (Buffer من git show)
# وبيجرب مفاتيح: TG_BOT_TOKEN ثم fallback. يرجع آخر نسخة فيها أسهم + يبعتها على تليجرام + تقرير recover-log.txt.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/recover-portfolio.yml"]
permissions:
  contents: write
concurrency: recover-pf
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: البحث والاستعادة
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          cat > recover.js <<'EOF'
          const {execSync}=require('child_process');
          const crypto=require('crypto');
          const fs=require('fs');
          const lines=[];
          function aesDec(buf,key){
            if(buf.length<29)throw new Error('too short');
            const iv=buf.slice(0,12),ct=buf.slice(12);
            const d=crypto.createDecipheriv('aes-256-gcm',key,iv);
            d.setAuthTag(ct.slice(ct.length-16));
            return JSON.parse(Buffer.concat([d.update(ct.slice(0,ct.length-16)),d.final()]).toString('utf8'));
          }
          const tok=(process.env.TG_BOT_TOKEN||'').trim();
          const chat=(process.env.TG_CHAT_ID||'').trim();
          const keys=[];
          if(tok)keys.push({n:'TG_BOT_TOKEN',k:crypto.createHash('sha256').update(tok).digest()});
          keys.push({n:'fallback-mistral-Mi',k:crypto.createHash('sha256').update('mistral-Mi').digest()});
          let commits=[];
          try{commits=execSync('git log --all --format=%H -- portfolio.dat').toString().trim().split('\n').filter(Boolean)}catch(e){}
          try{commits.push(execSync('git rev-parse HEAD').toString().trim())}catch(e){}
          lines.push('نسخ في التاريخ: '+commits.length);
          const seen=new Set();let found=null,foundRaw=null,foundHow=null;
          for(const c of commits){
            if(seen.has(c))continue;seen.add(c);
            let raw;
            try{raw=execSync('git show '+c+':portfolio.dat',{maxBuffer:10*1024*1024})}catch(e){continue}
            if(!(raw&&raw.length))continue;
            /* الصيغتان: بايتات خام مباشرة، أو نص base64 للبايتات */
            const cands=[{n:'خام',buf:raw}];
            try{
              const txt=raw.toString('latin1').replace(/\s/g,'');
              if(/^[A-Za-z0-9+/=]+$/.test(txt)&&txt.length>28)cands.push({n:'base64نص',buf:Buffer.from(txt,'base64')});
            }catch(e){}
            for(const cd of cands){
              for(const kk of keys){
                try{
                  const obj=aesDec(cd.buf,kk.k);
                  const n=(obj&&Array.isArray(obj.holdings))?obj.holdings.length:0;
                  lines.push(c.slice(0,8)+': نجح فك التشفير ('+cd.n+' بمفتاح '+kk.n+') — عدد الأسهم: '+n);
                  if(n>0&&!found){found=obj;foundRaw=raw;foundHow=cd.n+' بمفتاح '+kk.n}
                }catch(e){}
              }
            }
          }
          let msg;
          if(found){
            lines.push('النتيجة: اتلقت نسخة فيها '+found.holdings.length+' سهم — '+foundHow);
            const payload=JSON.stringify({holdings:found.holdings,funds:found.funds||[]});
            fs.writeFileSync('pf_recovered.json',payload);
            const list=found.holdings.map(h=>'- '+h.t+' x '+h.qty+' (متوسط '+h.avg+')').join(' | ');
            msg='♻️ اتلقت نسخة محفظتك الأصلية ('+found.holdings.length+' سهم): '+list+'  ||  لترجيعها في التطبيق: انسخ السطر ده وحطه في (استيراد المحفظة من نص) في الإعدادات: '+payload;
          }else{
            lines.push('النتيجة: مفيش نسخة بتتفك بأي مفتاح — المفاتيح المتاحة مفيش منها اللي اتشفرت بيه النسخ');
            msg='❌ فشل استعادة محفظتك: فك تشفير كل نسخ التاريخ فشل. اللي اتحاول: البايتات الخام وbase64، بمفتاح سر TG_BOT_TOKEN ومفتاح الاحتياطي.';
          }
          if(tok&&chat){
            fetch('https://api.telegram.org/bot'+tok+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chat,text:msg})}).catch(function(){});
            lines.push('اتبعتت رسالة تليجرام');
          }
          fs.writeFileSync('recover-log.txt',lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          EOF
          node recover.js
          git config user.name "mistral-Mi bot"
          git config user.email "actions@users.noreply.github.com"
          git add recover-log.txt pf_recovered.json 2>/dev/null || git add recover-log.txt
          git diff --cached --quiet || (git commit -m "🧯 استعادة v4: قراءة البايتات الخام مباشرة - تقرير recover-log.txt" && git push)
