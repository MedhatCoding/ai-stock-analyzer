# 📡 صناديق: تحديث NAV اليومي من مباشر → فرع fundnav — التطبيق بيقرأ منه (صفر استدعاءات من متصفح المستخدم)
# طلبان بس في اليوم (القائمة الإنجليزية + العربية) من GitHub Runner — احترام كامل لحدود المصدر المجاني
name: 📡 Funds NAV — تحديث قيم الصناديق من مباشر
on:
  push:
    branches: [main]
    paths: [".github/workflows/funds-nav.yml"]
  schedule:
    - cron: "30 18 * * *"   # 20:30 القاهرة — بعد إفصاحات NAV اليومية
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: funds-nav
  cancel-in-progress: true
jobs:
  nav:
    runs-on: ubuntu-latest
    steps:
      - name: 📡 سحب NAV من مباشر
        continue-on-error: true
        shell: bash
        run: |
          {
            python3 - <<'PY'
          import json, time, urllib.request, sys
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def fetch(url, tries=3):
              for a in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode("utf-8", "replace"))
                  except Exception as e:
                      print("try", a + 1, "failed:", e, flush=True)
                      if a == tries - 1: return None
                      time.sleep(5 + a * 5)
          en = fetch("https://english.mubasher.info/api/1/funds?country=eg&size=1000")
          ar = fetch("https://www.mubasher.info/api/1/funds?country=eg&size=1000")
          if not en or not ar: sys.exit("فشل سحب القائمة من مباشر")
          armap = {}
          for r in (ar.get("rows") or []):
              fid = r.get("fundId")
              if fid is not None: armap[fid] = (r.get("name") or "").strip()
          funds = []
          for r in (en.get("rows") or []):
              fid = r.get("fid") or r.get("fundId")
              name = (r.get("name") or "").strip()
              if fid is None or not name: continue
              funds.append({"id": fid, "en": name, "ar": armap.get(fid, ""), "nav": r.get("price") or 0, "d": (r.get("date") or "").strip()})
          out = {"t": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "source": "Mubasher Info", "funds": funds}
          with open("funds_nav.json", "w", encoding="utf-8") as fp:
              json.dump(out, fp, ensure_ascii=False)
          print("funds:", len(funds), flush=True)
          PY
          } > /tmp/nav.log 2>&1
      - name: 🖨️ اللوج
        if: always()
        run: cat /tmp/nav.log 2>/dev/null || echo "مفيش لوج"
      - name: 📤 نشر funds_nav.json على فرع fundnav
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pub
          if [ -f funds_nav.json ]; then
            cp funds_nav.json /tmp/pub/funds_nav.json
            MSG="chore: 📡 NAV اليومي للصناديق [skip ci]"
          else
            cp /tmp/nav.log /tmp/pub/nav-debug.txt 2>/dev/null || echo "مفيش لوج" > /tmp/pub/nav-debug.txt
            MSG="chore: 📡 تشخيص فشل NAV [skip ci]"
          fi
          cd /tmp/pub
          git init -q -b fundnav
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "$MSG"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/MedhatCoding/mistral-Mi.git" fundnav
          echo "✅ اتنشر على فرع fundnav"
