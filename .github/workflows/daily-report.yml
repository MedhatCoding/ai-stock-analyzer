# 📊 mistral-Mi — التقرير اليومي على تليجرام (محرك التطبيق نفسه على GitHub Actions)
# المدة: كل يوم من الأحد للخميس الساعة 11:00 ص بتوقيت القاهرة (ساعة بعد الافتتاح)
# محتوى: EGX30 + أفضل 4 فرص شراء للأسهم المتوافقة مع الشريعة فقط (EGX33 + متوافق خارج المؤشر) + تحذيرات بيع + توصيات محفظتي
# المحفظة: بتتزامن تلقائيًا من التطبيق (portfolio.dat مشفر AES) — وfallback: سر PORTFOLIO_JSON
# الأسرار: TG_BOT_TOKEN + TG_CHAT_ID (نفس بوت التطبيق) — المزامنة محتاجة نفس TG_BOT_TOKEN لفك التشفير

name: التقرير اليومي على تليجرام
on:
  schedule:
    - cron: "0 8,9,10,12 * * 0-4" # صيفًا: 8UTC=11:00 القاهرة · شتاءً: 9UTC=11:00 القاهرة — البوابة بتمنع قبل 11:00
  push:
    branches: [main]
    paths: [".github/workflows/daily-report.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: قفل الإرسال اليومي (مرة واحدة في اليوم مهني التأخير)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          TODAY="$(TZ=Africa/Cairo date +%F)"
          NOW_EPOCH="$(TZ=Africa/Cairo date +%s)"
          OPEN_EPOCH="$(TZ=Africa/Cairo date -d "today 11:00" +%s)"
          if [ "$EVENT" != "schedule" ]; then
            echo "تشغيل يدوي/تجريبي ($EVENT) — إرسال مباشر بدون قفل"
            echo "SKIP=false" >> "$GITHUB_ENV"; exit 0
          fi
          LAST="$(gh api "repos/${{ github.repository }}/actions/variables/LAST_REPORT_DATE" --jq .value 2>/dev/null || echo "")"
          echo "اليوم: $TODAY · آخر يوم اتبعت فيه: ${LAST:-مفيش} · الساعة دلوقتي: $(TZ=Africa/Cairo date +%H:%M)"
          if [ "$NOW_EPOCH" -lt "$OPEN_EPOCH" ]; then
            echo "⏳ لسه قبل 11 صباحًا بتوقيت القاهرة — التقرير بيتبعت بعد فتح البورصة بساعة، تخطي"
            echo "SKIP=true" >> "$GITHUB_ENV"
          elif [ "$LAST" = "$TODAY" ]; then
            echo "ℹ️ التقرير اتبعت خلاص النهاردة ($TODAY) — تخطي"
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "لسه مبعتناش النهاردة — هيتم الإرسال"
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: تحميل الكود
        if: env.SKIP == 'false'
        uses: actions/checkout@v4

      - name: تنزيل لقطات الأسعار والتاريخ
        if: env.SKIP == 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "⬇️ تنزيل live.json وhist.json من فرعي live وhist..."
          curl -fsSL --retry 2 --max-time 30 -o live.json "https://raw.githubusercontent.com/MedhatCoding/mistral-Mi/live/live.json" \
            && echo "✅ live.json اتنزلت ($(wc -c < live.json) بايت)" \
            || echo "⚠️ live.json مش متاحة — التقرير هيشتغل من التاريخ بس"
          curl -fsSL --retry 2 --max-time 60 -o hist.json "https://raw.githubusercontent.com/MedhatCoding/mistral-Mi/hist/hist.json" \
            && echo "✅ hist.json اتنزلت ($(wc -c < hist.json) بايت)" \
            || echo "❌ hist.json مش متاحة — التقرير مش هينفع"

      - name: استخراج محرك التحليل من index.html
        if: env.SKIP == 'false'
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -m1 "^const NF=" index.html
            grep -m1 "^const lastOf=" index.html
            grep -m1 "^let SIGW=" index.html
            grep -E "^function (sma|ema|rsi|macd|boll|atr)\(" index.html
            awk '/^function analyze\(/{f=1} f{print} f&&/^}/{f=0}' index.html
          } > engine.js
          awk '/^const S = \[/{f=1} f{print} f&&/\]\.map\(a=>/{f=0}' index.html > names.js
          echo 'const NAMES=Object.fromEntries(S.map(x=>[x.t,x.n]));' >> names.js
            grep -E "^const SHARIA_(IDX|EXTRA) ?=" index.html > sharia.js
            echo 'const SHARIA=[...SHARIA_IDX,...SHARIA_EXTRA];' >> sharia.js
            if ! grep -q "SHARIA_IDX" sharia.js; then echo "❌ استخراج قائمة الشريعة فشل"; exit 1; fi
            echo "✅ قائمة الشريعة اتعملت ($(wc -l < sharia.js) سطر)"
          if ! grep -q "function analyze" engine.js; then
            echo "❌ استخراج المحرك فشل — شكل index.html اتغير"; exit 1
          fi
          echo "✅ المحرك اتعمل: $(wc -l < engine.js) سطر محرك + $(wc -l < names.js) سطر أسماء"

      - name: بناء سكريبت التقرير
        if: env.SKIP == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cat > report_body.js <<'SAHMY_EOF'
          /* 📊 مولّد التقرير اليومي — نفس محرك التطبيق بالظبط (محرك مستخرج من index.html فوقه) */
          const fs=require('fs');
          function readJSON(p,dflt){try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch(e){console.log('⚠️ تعذر قراءة '+p+' — '+e.message);return dflt}}
          const live=readJSON('live.json',null);
          const hist=readJSON('hist.json',null);
          if(!hist||!hist.stocks){console.log('❌ hist.json مش موجود أو تالف — شغّل ريليه التاريخ الأول');process.exit(1)}
          const TOK=(process.env.TG_BOT_TOKEN||'').trim(),CHAT=(process.env.TG_CHAT_ID||'').trim();
          if(!TOK||!CHAT){console.log('❌ أضف الأسرار TG_BOT_TOKEN وTG_CHAT_ID من Settings ← Secrets and variables ← Actions');process.exit(1)}
          const NOW=new Date();
          const fmtD=new Intl.DateTimeFormat('ar-EG',{timeZone:'Africa/Cairo',weekday:'long',day:'numeric',month:'long'});
          const fmtT=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',hour12:false});
          const dayTxt=fmtD.format(NOW),timeTxt=fmtT.format(NOW);
          /* أسعار لحظية من لقطة الريليه */
          const Q={};let snapAge=null;
          if(live&&live.t&&Array.isArray(live.quotes)){
            snapAge=Math.max(0,Math.round((Date.now()-live.t)/60000));
            live.quotes.forEach(function(q){if(q&&q.ticker&&q.price!=null)Q[q.ticker]={price:q.price,chg:(q.change_percent!=null?q.change_percent:(q.open&&q.change!=null?q.change/q.open*100:0)),vol:(q.volume!=null?q.volume:null)}});
          }
          const IDX=(live&&live.idx&&live.idx.data)?live.idx.data:null;
          /* تحليل كل الأسهم بنفس منطق التطبيق: تاريخ الريليه + شمعة النهاردة الحية — وفرص الشراء والتحذيرات للأسهم المتوافقة مع الشريعة فقط ☪️ */
          const res=[];
          Object.keys(hist.stocks).forEach(function(sym){
            const raw=hist.stocks[sym]||[];
            const arr=raw.filter(function(c){return c&&c.c>0}).map(function(c){return {d:(c.d||null),o:(c.o!=null?c.o:c.c),h:(c.h!=null?c.h:c.c),l:(c.l!=null?c.l:c.c),c:c.c,v:(c.v||0)}});
            if(arr.length<60)return;
            let v=analyze(arr);if(!v)return;
            let price=arr[arr.length-1].c,prev=arr.length>1?arr[arr.length-2].c:price,chg=prev?(price-prev)/prev*100:0,vol=arr[arr.length-1].v||0;
            const q=Q[sym];
            if(q&&q.price>0){
              const base=price;
              if(Math.abs(q.price-base)/base>0.001){
                arr.push({d:NOW.toISOString().slice(0,10),o:base,h:Math.max(base,q.price),l:Math.min(base,q.price),c:q.price,v:(q.vol||0)});
                const nv=analyze(arr);if(nv)v=nv;
              }
              price=q.price;prev=base;chg=(q.chg!=null?q.chg:(price-prev)/prev*100);if(q.vol)vol=q.vol;
            }
            res.push({sym:sym,name:(NAMES[sym]||sym),price:price,prev:prev,chg:chg,vol:vol,v:v,sh:SHARIA.includes(sym)});
          });
          /* فلتر سيولة: آخر حجم × السعر ≥ مليون جنيه (حجم غير معروف = بيتجاوز الفلتر) */
          const liq=res.filter(function(r){return r.vol==null||r.price*r.vol>=1000000});
          const buys=liq.filter(function(r){return r.sh&&r.v.sc>=1.5}).sort(function(a,b){return b.v.sc-a.v.sc}).slice(0,4);
          const warns=liq.filter(function(r){return r.sh&&r.v.sc<=-1.5}).sort(function(a,b){return a.v.sc-b.v.sc}).slice(0,2);
          const sign=function(x){return (x>=0?'+':'')+NF(x,2)};
          function stockLines(r){
            const v=r.v;
            const pos=(v.rs||[]).filter(function(x){return x[0]==='✅'});
            const top=(pos.length?pos:v.rs).slice(0,2);
            const L=[];
            L.push(v.em+' '+r.sym+' — '+r.name);
            L.push('التوصية: '+v.rec+' '+'⭐'.repeat(v.stars)+' (ثقة '+v.conf+'٪) · السعر '+NF(r.price)+' ج.م ('+sign(r.chg)+'٪)');
            L.push('🛑 وقف '+NF(v.stop)+' · 🎯 هدف '+NF(v.t1)+' · مخاطرة '+v.risk);
            top.forEach(function(x){L.push(x[0]+' '+x[1])});
            return L.join('\n');
          }
          let msg='📊 mistral-Mi — التقرير اليومي ☪️ فرص الشريعة فقط — '+dayTxt+' · '+timeTxt+' توقيت القاهرة\n';
          if(IDX&&IDX.value!=null){
            const ic=(IDX.change_percent!=null?IDX.change_percent:(IDX.open?(IDX.value-IDX.open)/IDX.open*100:0));
            msg+='\n🇪🇬 EGX30: '+NF(IDX.value,1)+' ('+sign(ic)+'٪)';
          }
          if(snapAge!=null)msg+='\n⏱️ لقطة الأسعار عمرها ~'+snapAge+' دقيقة';
          if(buys.length){
            msg+='\n\n🚀 أفضل فرص الشراء:\n\n';
            buys.forEach(function(r,i){msg+=(i+1)+')\n'+stockLines(r)+'\n\n'});
          }else{
            msg+='\n\n😐 مفيش فرص شراء واضحة النهاردة — الأفضل انتظار إشارات أوضح.\n\n';
          }
          if(warns.length){
            msg+='⚠️ تحذيرات بيع:\n\n';
            warns.forEach(function(r){msg+=stockLines(r)+'\n\n'});
          }
          /* 💼 توصيات المحفظة — أولوية: مزامنة التطبيق (pf.json) ← سر PORTFOLIO_JSON */
          let pf=null;
          try{pf=JSON.parse(fs.readFileSync('pf.json','utf8'))}catch(e){pf=null}
          if(!pf){try{pf=JSON.parse(process.env.PORTFOLIO_JSON||'')}catch(e){pf=null}}
          if(pf&&Object.keys(pf).length){
            msg+='💼 توصيات محفظتي:\n\n';
            const bysym={};res.forEach(function(r){bysym[r.sym]=r});
            Object.keys(pf).forEach(function(sym){
              const h=pf[sym]||{},q=h.q||h.qty||0,avg=h.avg||0;
              const r=bysym[sym];
              if(!r){msg+='• '+sym+': مفيش بيانات كافية للتحليل — راجعه في التطبيق.\n';return}
              const pl=(q&&avg)?(r.price-avg)*q:0;
              const plp=(avg?(r.price-avg)/avg*100:0);
              let advice;
              if(r.v.sc>=1.5)advice='احتفظ / فكّر زيادة';
              else if(r.v.sc>-1.5)advice='احتفظ وانتظر';
              else advice='فكّر تقليل الحصة';
              msg+='• '+r.sym+' — '+r.name+'\n  السعر '+NF(r.price)+' ('+sign(r.chg)+'٪) · ربح/خسارة '+(pl>=0?'+':'')+NF(pl,0)+' ج.م ('+sign(plp)+'٪)\n  '+r.v.em+' '+r.v.rec+' → '+advice+' · 🛑 وقف '+NF(r.v.stop)+' · 🎯 '+NF(r.v.t1)+'\n';
            });
            msg+='\n';
          }
          msg+='— التحليل الكامل بالرسومات وسجل التوصيات والتعلم الآلي في التطبيق:\nmedhatcoding.github.io/mistral-Mi';
          /* إرسال تليجرام — تقسيم تلقائي لو عدّى 3800 حرف */
          async function main(){
            const chunks=[];let cur='';
            msg.split('\n').forEach(function(line){
              if((cur?cur+'\n'+line:line).length>3800){chunks.push(cur);cur=line}
              else cur=cur?cur+'\n'+line:line;
            });
            if(cur)chunks.push(cur);
            for(const c of chunks){
              const r=await fetch('https://api.telegram.org/bot'+TOK+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT,text:c})});
              const j=await r.json().catch(function(){return{}});
              console.log('تلجرام HTTP '+r.status+(j.ok?' — تم الإرسال ✅':' — '+(j.description||'خطأ غير معروف')));
              if(!r.ok)process.exit(1);
            }
            console.log('✅ التقرير اتبعت — '+chunks.length+' رسالة ('+msg.length+' حرف)');
          }
          main().catch(function(e){console.log('❌ فشل الإرسال: '+e.message);process.exit(1)});
          SAHMY_EOF
          cat engine.js names.js sharia.js report_body.js > report.js
          echo "✅ report.js جاهز ($(wc -l < report.js) سطر)"

      - name: فحص الأسرار
        if: env.SKIP == 'false'
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "❌ أسرار التليجرام ناقصة — أضف TG_BOT_TOKEN وTG_CHAT_ID من"
            echo "   Settings ← Secrets and variables ← Actions ← New repository secret"
            exit 1
          fi
          echo "✅ أسرار التليجرام موجودة"

      - name: تجميع المحفظة من التطبيق
        if: env.SKIP == 'false'
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          set -euo pipefail
          cat > pf.js <<'PF_EOF'
          /* 🔐 فك تشفير محفظة المستخدم المرفوعة من التطبيق — AES-256-GCM بمفتاح SHA-256 لتوكن البوت */
          const fs=require('fs');
          const crypto=require('crypto');
          const TOK=(process.env.TG_BOT_TOKEN||'').trim();
          (async function(){
            try{
              const r=await fetch("https://raw.githubusercontent.com/MedhatCoding/mistral-Mi/main/portfolio.dat?cb="+Date.now(),{cache:'no-store'});
              if(!r.ok)throw new Error("HTTP "+r.status);
              const b64=(await r.text()).replace(/\s/g,'');
              const buf=Buffer.from(b64,'base64');
              if(buf.length<30)throw new Error("ملف صغير زيادة");
              const key=crypto.createHash('sha256').update(TOK,'utf8').digest();
              const iv=buf.slice(0,12),ct=buf.slice(12);
              const d=crypto.createDecipheriv('aes-256-gcm',key,iv);
              d.setAuthTag(ct.slice(ct.length-16));
              const pt=Buffer.concat([d.update(ct.slice(0,ct.length-16)),d.final()]).toString('utf8');
              const obj=JSON.parse(pt);
              if(!obj||!Array.isArray(obj.holdings))throw new Error("الصيغة مش مفهومة");
              const pf={};
              obj.holdings.forEach(function(h){if(h&&h.t&&h.qty>0&&h.avg>0)pf[h.t]={q:h.qty,avg:h.avg}});
              fs.writeFileSync('pf.json',JSON.stringify(pf));
              console.log('✅ محفظة المستخدم جاية من مزامنة التطبيق: '+Object.keys(pf).length+' سهم');
            }catch(e){console.log('ℹ️ مفيش مزامنة محفظة من التطبيق — '+e.message);}
            process.exit(0);
          })();
          PF_EOF
          node pf.js || true
          if [ -f pf.json ]; then
            echo "✅ pf.json جاهزة ($(wc -c < pf.json) بايت)"
          else
            echo "ℹ️ التقرير هيستخدم سر PORTFOLIO_JSON لو موجود — أو قسم المحفظة هيتخطى"
          fi

      - name: توليد وإرسال التقرير
        if: env.SKIP == 'false'
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: |
          set -euo pipefail
          echo "🧠 شغّل المحرك على $(ls -1 hist.json >/dev/null 2>&1 && echo 'تاريخ كامل' || echo 'بدون تاريخ')..."
          node report.js

      - name: تحديث علامة اليوم (منع تكرار الإرسال)
        if: env.SKIP == 'false' && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TODAY="$(TZ=Africa/Cairo date +%F)"
          if gh api -X PATCH "repos/${{ github.repository }}/actions/variables/LAST_REPORT_DATE" -f value="$TODAY" 2>/dev/null; then
            echo "✅ علامة اليوم اتحدثت: $TODAY"
          elif gh api "repos/${{ github.repository }}/actions/variables/LAST_REPORT_DATE" >/dev/null 2>&1; then
            echo "⚠️ تعذر تحديث العلامة"
          else
            gh api "repos/${{ github.repository }}/actions/variables" -f name=LAST_REPORT_DATE -f value="$TODAY" >/dev/null && echo "✅ اتعملت علامة جديدة: $TODAY"
          fi
